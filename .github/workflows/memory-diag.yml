name: Memory diagnostic
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/memory-diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - run: node tests/e2e.mjs
        env:
          ONLY: '^X '
          EXTRA_CASES: '[{"name": "X stock tiny", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "english", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true}, {"name": "X NB tiny default", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "norwegian", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true}, {"name": "X NB tiny no arena", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "norwegian", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true, "query": "?session={\"enableCpuMemArena\":false}"}, {"name": "X NB tiny no mem pattern", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "norwegian", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true, "query": "?session={\"enableMemPattern\":false}"}, {"name": "X NB tiny no arena, no pattern", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "norwegian", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true, "query": "?session={\"enableCpuMemArena\":false,\"enableMemPattern\":false}"}, {"name": "X NB tiny basic graph opt", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "norwegian", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true, "query": "?session={\"graphOptimizationLevel\":\"basic\"}"}, {"name": "X NB tiny no graph opt", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "norwegian", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true, "query": "?session={\"graphOptimizationLevel\":\"disabled\"}"}, {"name": "X stock tiny no arena, no pattern", "engine": "webkit", "model": "tiny", "url": "https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828", "lang": "english", "segments": 3, "memoryLimitMB": 4000, "skipLanguageCheck": true, "query": "?session={\"enableCpuMemArena\":false,\"enableMemPattern\":false}"}]'
