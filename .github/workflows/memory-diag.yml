name: Memory diagnostic
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/memory-diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - run: node tests/e2e.mjs
        env:
          ONLY: '^X |iPhone'
          EXTRA_CASES: >-
            [{"name":"X stock tiny, NRK audio","engine":"webkit","model":"tiny","url":"https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828","lang":"english","segments":3,"memoryLimitMB":4000,"skipLanguageCheck":true},
             {"name":"X NB tiny, English audio","engine":"webkit","model":"tiny","url":"https://pca.st/episode/662e3967-b4b0-4d36-84d1-d0d8b49eb03b","lang":"norwegian","segments":3,"memoryLimitMB":4000,"skipLanguageCheck":true},
             {"name":"X NB base, NRK audio","engine":"webkit","model":"base","url":"https://podcasts.apple.com/no/podcast/x/id1198538093?i=1000780388828","lang":"norwegian","segments":3,"memoryLimitMB":4000},
             {"name":"X stock base, English audio","engine":"webkit","model":"base","url":"https://pca.st/episode/662e3967-b4b0-4d36-84d1-d0d8b49eb03b","lang":"english","segments":3,"memoryLimitMB":4000}]
