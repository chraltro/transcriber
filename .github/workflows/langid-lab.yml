name: Language check lab
# Paused: runs only when started by hand (Actions tab, Run workflow). The automatic triggers it had
# are kept below, commented out, to switch back on later.
on:
  workflow_dispatch:
# Automatic triggers (paused):
# push:
#   branches: ['claude/**']
#   paths: ['tests/langid-lab.mjs', 'lib/langid.js', '.github/workflows/langid-lab.yml']

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/langid-lab.mjs
