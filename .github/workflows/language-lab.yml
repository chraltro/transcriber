name: Language lab
on:
  push:
    branches: ['claude/**']
    paths: ['tests/language-lab.mjs', '.github/workflows/language-lab.yml', 'lib/prompted.js']
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/language-lab.mjs
        env:
          MODE: search
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: [danish]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/language-lab.mjs
        env:
          MODE: ref
          LANG_NAME: ${{ matrix.lang }}
          REF_MODEL: Xenova/whisper-medium
      - uses: actions/upload-artifact@v4
        with:
          name: ref-${{ matrix.lang }}
          path: |
            clip.wav
            ref.json
  model:
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: danish, model: 'onnx-community/whisper-large-v3-turbo|dtype=q8|run=1' }
          - { lang: danish, model: 'onnx-community/whisper-large-v3-turbo|dtype=q8|run=2' }
          - { lang: danish, model: 'onnx-community/whisper-large-v3-turbo|dtype=q4|run=1' }
          - { lang: danish, model: 'onnx-community/whisper-large-v3-turbo|dtype=q4|run=2' }
          - { lang: danish, model: 'onnx-community/whisper-small|dtype=q8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - uses: actions/download-artifact@v4
        with:
          name: ref-${{ matrix.lang }}
      - run: node tests/language-lab.mjs
        env:
          MODE: model
          MODEL: ${{ matrix.model }}
          LANG_NAME: ${{ matrix.lang }}
