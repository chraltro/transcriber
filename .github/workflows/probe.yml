name: Probe
# Paused: runs only when started by hand (Actions tab, Run workflow). The automatic triggers it had
# are kept below, commented out, to switch back on later.
on:
  workflow_dispatch:
# Automatic triggers (paused):
# push:
#   branches: ['claude/**']
#   paths: ['tests/link-probe.mjs', 'tests/probe.mjs', 'tests/firefox-probe.mjs', 'tests/nb-probe.mjs', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/link-probe.mjs
