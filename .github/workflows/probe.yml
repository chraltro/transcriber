name: Probe
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q() { curl -sS "https://itunes.apple.com/search?$1" | python3 -c "import json,sys;r=json.load(sys.stdin)['results'];print(len(r),'results');[print('   ',x.get('trackName'),'|',x.get('collectionName'),'|',x.get('releaseDate')) for x in r[:4]]"; }
          T="What%20Safeguarding%20Nukes%20Can%20Teach%20Us%20About%20Safeguarding%20A.I."
          echo "latest Daily episodes per lookup:"; curl -sS "https://itunes.apple.com/lookup?id=1200361736&entity=podcastEpisode&limit=4" | python3 -c "import json,sys;[print('   ',x.get('trackName'),'|',x.get('releaseDate')) for x in json.load(sys.stdin)['results'][1:]]"
          echo "titleTerm:"; q "term=$T&entity=podcastEpisode&attribute=titleTerm&limit=10"
          echo "with show name:"; q "term=The%20Daily%20$T&entity=podcastEpisode&limit=10"
          OLD=$(curl -sS "https://itunes.apple.com/lookup?id=1200361736&entity=podcastEpisode&limit=30" | python3 -c "import json,sys,urllib.parse;print(urllib.parse.quote(json.load(sys.stdin)['results'][-1]['trackName']))")
          echo "older episode ($OLD) plain:"; q "term=$OLD&entity=podcastEpisode&limit=10"
          echo "older episode titleTerm:"; q "term=$OLD&entity=podcastEpisode&attribute=titleTerm&limit=10"
