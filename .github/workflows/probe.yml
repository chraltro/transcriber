name: Probe
on:
  push:
    branches: ['claude/**']
    paths: ['tests/probe.mjs', 'tests/firefox-probe.mjs', '.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - run: node tests/firefox-probe.mjs
