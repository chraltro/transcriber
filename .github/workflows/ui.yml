name: UI test

# Every push: unit tests, the fast UI test (the real page with the speech models swapped for
# a fake worker) and the podcast test (the real server with a stand-in for the podcast world).
# Takes a few minutes. Real models and real podcasts are e2e.yml.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests
        run: npm test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: UI test
        run: node tests/ui.mjs
      - name: Podcast test
        run: node tests/pod.mjs
      # An iPhone is where this is used, and every browser there is Safari's engine.
      - name: Podcast test in WebKit (iPhone)
        run: node tests/pod.mjs offline; node tests/pod.mjs phone
        env:
          ENGINE: webkit
      # One run only: the worker and the server as they were when the app went dead on an iPhone
      # (dccff64), to see whether WebKit here shows the same. Taken out again after this run.
      - name: The earlier worker in WebKit (one run, to compare)
        if: always()
        continue-on-error: true
        run: |
          git fetch --depth=1 origin dccff64e871ea96f69d123a9f77818e650be904c
          git checkout dccff64e871ea96f69d123a9f77818e650be904c -- coi-sw.js server lib/ads.js lib/adbreaks.js
          node tests/pod.mjs offline || true
          git rm -q -f --cached lib/ads.js lib/adbreaks.js && rm -f lib/ads.js lib/adbreaks.js
          git checkout HEAD -- coi-sw.js server
        env:
          ENGINE: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/
