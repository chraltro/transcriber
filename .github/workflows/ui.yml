name: UI test

# Every push: unit tests, the fast UI test (the real page with the speech models swapped for
# a fake worker) and the podcast test (the real server with a stand-in for the podcast world).
# Takes a few minutes. Real models and real podcasts are e2e.yml.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests
        run: npm test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: UI test
        run: node tests/ui.mjs
      - name: Podcast test
        run: node tests/pod.mjs
      # An iPhone is where this is used, and every browser there is Safari's engine.
      - name: Podcast test in WebKit (iPhone)
        run: node tests/pod.mjs offline; node tests/pod.mjs phone
        env:
          ENGINE: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/
