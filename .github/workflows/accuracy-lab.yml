name: Accuracy lab
on:
  push:
    branches: ['claude/**']
    paths: ['tests/accuracy-lab.mjs', '.github/workflows/accuracy-lab.yml', 'lib/prompted.js', 'lib/context.js', 'lib/glossary.js']
  workflow_dispatch:
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: [A, B, C, F]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/accuracy-lab.mjs
        env:
          CONFIG: ${{ matrix.config }}
          MINUTES: 40
