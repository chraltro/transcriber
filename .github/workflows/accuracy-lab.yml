name: Accuracy lab
on:
  push:
    branches: ['claude/**']
    paths: ['tests/accuracy-lab.mjs', '.github/workflows/accuracy-lab.yml', 'lib/prompted.js', 'lib/context.js', 'lib/glossary.js', 'lib/speakers.js', 'lib/diarize.js', 'lib/stream.js']
  workflow_dispatch:
jobs:
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - uses: actions/cache@v4
        id: refcache
        with:
          path: |
            ref.json
            ep.mp3
          key: lab-ref-plain-english-turbo-15min-v2
      - run: npm i --no-save @huggingface/transformers@4.3.0
        if: steps.refcache.outputs.cache-hit != 'true'
      - run: node tests/accuracy-lab.mjs
        if: steps.refcache.outputs.cache-hit != 'true'
        env:
          CONFIG: REF
      - uses: actions/upload-artifact@v4
        with:
          name: ref
          path: |
            ref.json
            ep.mp3
  lab:
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: [B, C, T]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - uses: actions/download-artifact@v4
        with:
          name: ref
      - run: node tests/accuracy-lab.mjs
        env:
          CONFIG: ${{ matrix.config }}
          MINUTES: 40
