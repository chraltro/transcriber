name: End-to-end test

on:
  push:
    branches: ['claude/**']
    paths: ['app.js', 'worker.js', 'index.html', 'style.css', 'lib/**', 'tests/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
    inputs:
      only:
        description: Regex of case names to run (empty runs all)
        required: false
        default: ''
      extra_cases:
        description: JSON array of extra cases
        required: false
        default: ''

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests (with network checks of the model files)
        run: NETWORK_TESTS=1 npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit firefox
      - name: Run e2e
        run: node tests/e2e.mjs
        env:
          ONLY: ${{ github.event.inputs.only }}
          EXTRA_CASES: ${{ github.event.inputs.extra_cases }}
