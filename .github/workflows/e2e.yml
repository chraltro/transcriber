name: End-to-end test

on:
  push:
    branches: ['claude/**']
    paths: ['app.js', 'worker.js', 'index.html', 'tests/e2e.mjs', '.github/workflows/e2e.yml']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run e2e
        run: node tests/e2e.mjs
