name: End-to-end test

# The slow one: real models on real podcasts in Chromium, iPhone WebKit and Firefox (about 20
# minutes). It runs when the transcription engine changes, every night, and on demand; look and
# feel changes are covered by the UI test (ui.yml).
on:
  push:
    branches: ['claude/**']
    paths: ['worker.js', 'coi-sw.js', 'lib/stream.js', 'lib/prompted.js', 'lib/diarize.js', 'lib/segment.js', 'lib/models.js', 'lib/mp3.js', 'lib/wav.js', 'lib/links.js', 'lib/id3.js', 'tests/e2e.mjs', '.github/workflows/e2e.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Regex of case names to run (empty runs all)
        required: false
        default: ''
      extra_cases:
        description: JSON array of extra cases
        required: false
        default: ''

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests (with network checks of the model files)
        run: NETWORK_TESTS=1 npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit firefox
      - name: Run e2e
        run: node tests/e2e.mjs
        env:
          ONLY: ${{ github.event.inputs.only }}
          EXTRA_CASES: ${{ github.event.inputs.extra_cases }}
