name: Speaker bench
# Who said what, scored against podcasts' own published transcripts (tests/speaker-bench.mjs).
on:
  push:
    branches: ['claude/**']
    paths: ['tests/speaker-bench.mjs', 'tests/transcripts.mjs', '.github/workflows/speaker-bench.yml', 'lib/speakers.js', 'lib/diarize.js']
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [freshair, upfirst, planetmoney, freakonomics, lex, cwt, 80k]
        # Other voice-print models are compared by adding them here (VOICE_MODEL). Tried: WavLM
        # base-plus-sv separated people worse on 6 of 7 shows (AUC 66-95% vs 68-99%); UniSpeech-SAT
        # isn't supported by transformers.js 4.3; WeSpeaker ResNet293 is gated on Hugging Face.
        voice: ['']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/speaker-bench.mjs
        env:
          SOURCE: ${{ matrix.source }}
          VOICE_MODEL: ${{ matrix.voice }}
