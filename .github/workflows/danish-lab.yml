name: Danish lab
on:
  push:
    branches: ['claude/**']
    paths: ['tests/danish-lab.mjs', '.github/workflows/danish-lab.yml']
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/danish-lab.mjs
        env:
          MODE: search
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - run: node tests/danish-lab.mjs
        env:
          MODE: ref
      - uses: actions/upload-artifact@v4
        with:
          name: danish-ref
          path: |
            clip.wav
            ref.json
  model:
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ['onnx-community/whisper-large-v3-turbo', 'onnx-community/whisper-large-v3-turbo|prompt=0', 'onnx-community/whisper-large-v3-turbo|ts=0', 'onnx-community/whisper-large-v3-turbo|ts=0|prompt=0', 'onnx-community/whisper-small', 'Xenova/whisper-medium', 'PierreMesure/roest-315m-onnx']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm i --no-save @huggingface/transformers@4.3.0
      - uses: actions/download-artifact@v4
        with:
          name: danish-ref
      - run: node tests/danish-lab.mjs
        env:
          MODE: model
          MODEL: ${{ matrix.model }}
